<!DOCTYPE html>
<!--
  ===========================================================================
  index.html — LE SEUL FICHIER HTML DU SITE
  ---------------------------------------------------------------------------
  Le site est une SPA (Single Page Application) : il n'existe qu'une page
  HTML. Quand vous cliquez sur un lien, JavaScript remplace le contenu de
  <main> au lieu de demander une nouvelle page au serveur. C'est ce qui
  permet des transitions fluides et zero temps de chargement apres l'arrivee.

  Ce fichier ne contient donc presque pas de contenu : il pose la COQUILLE
  (loader, formulaire du prenom, en-tete, main vide, pied de page) et laisse
  js/app.js remplir le reste a partir de js/content.js.
  ===========================================================================
-->
<html lang="en">
<head>
  <!-- charset en premier : indispensable pour que les accents s'affichent -->
  <meta charset="utf-8">

  <!-- viewport : sans cette ligne, les telephones simulent un ecran de bureau
       et affichent le site en tout petit. C'est la base du responsive. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- theme-color colore la barre d'adresse du navigateur sur mobile -->
  <meta name="theme-color" content="#2078F0">

  <title>Marvin Sorhaindo — Product designer</title>
  <meta name="description" content="Portfolio of Marvin Sorhaindo, product designer based in Montréal. Three years of healthcare SaaS: hospital scheduling, clinical data sync, web redesigns.">

  <!-- Open Graph : ce qui s'affiche quand le lien est partage sur LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Marvin Sorhaindo — Product designer">
  <meta property="og:description" content="Three years of healthcare SaaS. Twenty-four scheduling rules reduced to nine.">

  <!--
    SECURITE — Content Security Policy.
    Cette ligne interdit au navigateur d'executer du JavaScript qui ne
    viendrait pas de ce site ('self'). Si quelqu'un parvenait a injecter
    <script src="https://mechant.com/x.js"> dans la page, le navigateur
    refuserait de le charger. C'est notre 2e barriere apres le nettoyage
    du prenom saisi dans le formulaire (voir app.js, fonction cleanName).
    'unsafe-inline' est autorise pour les styles seulement, pas pour les scripts.
  -->
  <!--
    Deux exceptions ont ete ajoutees pour Google Fonts (voir le bloc police
    juste en dessous) : fonts.googleapis.com pour la feuille de style, et
    fonts.gstatic.com pour les fichiers .woff2 eux-memes. Ce sont les seules
    origines externes autorisees par tout le site.
  -->
  <!--
    media.contra.com est autorise pour les images et les videos du projet
    Contraintes, hebergees sur Contra. C'est une DEPENDANCE EXTERNE assumee :
    si le projet est supprime ou renomme sur Contra, ces medias disparaissent
    du site. Pour s'en affranchir, voir MEDIA dans js/content.js.
  -->
  <!--
    dotlottie-wc (voir plus bas, avant </head>) charge son moteur WASM depuis
    jsdelivr, avec unpkg en repli : les deux origines doivent donc etre
    autorisees en script-src (le <script type="module"> lui-meme) ET en
    connect-src (le fetch() du binaire .wasm). 'wasm-unsafe-eval' est requis
    par les navigateurs recents pour executer du WebAssembly sous CSP stricte.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 img-src 'self' data: https://media.contra.com;
                 media-src 'self' https://media.contra.com;
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src 'self' https://fonts.gstatic.com;
                 script-src 'self' 'wasm-unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net;
                 connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net;
                 frame-src https://www.figma.com https://embed.figma.com;
                 base-uri 'none';
                 form-action 'none'">

  <!-- dotlottie-wc : composant web pour lire les animations Lottie/.lottie
       (utilise ici pour la contrainte "limite", exportee en JSON Lottie). -->
  <script type="module" src="https://unpkg.com/@lottiefiles/dotlottie-wc@latest/dist/dotlottie-wc.js"></script>

  <!--
    LA POLICE : Raleway, imposee par la maquette Figma.
    C'est une grotesque geometrique tres reconnaissable ; aucune police
    systeme ne s'en approche, il faut donc la telecharger.

    preconnect ouvre la connexion aux serveurs de Google AVANT que le
    navigateur ne decouvre qu'il en a besoin, ce qui economise un aller-retour
    reseau. crossorigin est obligatoire sur le second : les polices sont
    servies en mode anonyme et la connexion doit correspondre.

    display=swap affiche immediatement le texte dans une police de secours,
    puis bascule sur Raleway une fois chargee. Sans cette option, le texte
    resterait invisible jusqu'a 3 secondes.

    >>> A FAIRE PLUS TARD : auto-heberger la police <<<
    Cette balise est la seule requete externe du site et contredit l'exigence
    de depart ("tout charger une fois, le plus vite possible"). Pour la
    supprimer : telecharger les 4 graisses en .woff2, les placer dans
    assets/fonts/, remplacer ce lien par des regles @font-face dans le CSS,
    et retirer les deux autorisations Google de la CSP ci-dessus.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&family=Roboto:wght@400;500&display=swap">
  <!-- Roboto : uniquement pour le widget "constructeur de contraintes" de
       l'etude de cas Contraintes (.constraint-builder), pour correspondre
       exactement a la police de la maquette Figma d'origine de ce
       composant precis. Le reste du site reste en Raleway. -->

  <!-- Une seule feuille de style pour tout le site -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!--
    Lien d'evitement : invisible a la souris, mais le premier element atteint
    par la touche Tab. Il permet a quelqu'un qui navigue au clavier ou au
    lecteur d'ecran de sauter la navigation pour aller droit au contenu.
  -->
  <a class="skip-link" href="#main" data-i18n="skipToContent">Skip to main content</a>

  <!--
    ================ 0. LE CALQUE DU DESSOUS (etudes de cas) ================
    Vide 99 % du temps. Quand on ouvre une etude de cas, app.js y depose une
    PHOTO de la page qu'on vient de quitter (un simple clone du DOM, fige au
    scroll ou il etait) : c'est elle qu'on voit floutee et reduite derriere
    la fiche qui monte. Rien n'est vraiment "ouvert par-dessus" — la page
    d'accueil n'existe plus a ce moment-la, seule sa photo reste. C'est ce
    que veut dire "faux calque" : l'illusion coute un clone et un flou, pas
    une seconde application vivante en arriere-plan.
    aria-hidden + inert : purement decoratif. aria-hidden le retire des
    lecteurs d'ecran, mais aria-hidden SEUL laisserait ses liens clones
    atteignables a la touche Tab — le pire des deux mondes : un focus
    invisible, sur une copie morte. inert coupe le clic, le focus et la
    selection d'un seul attribut.
  -->
  <div id="underlay" class="underlay" aria-hidden="true" inert></div>

  <!--
    ===================== 1. LE LOADER =====================
    Affiche pendant que les images se preparent. Il est dans le HTML (et non
    cree en JS) pour etre visible immediatement, avant meme que JavaScript
    ne demarre. aria-hidden="true" : purement decoratif, les lecteurs
    d'ecran l'ignorent.
  -->
  <div id="loader" class="loader" aria-hidden="true">
    <div class="loader__mark">
      <span class="loader__bar"></span>
    </div>
  </div>

  <!--
    ================ 2. LE PORTAIL (formulaire du prenom) ================
    C'est un vrai <form> : il fonctionne au clavier, la touche Entree valide,
    et le navigateur gere l'etiquette du champ. On l'intercepte en JS pour
    l'empecher de recharger la page (voir event 'submit' dans app.js).
    Aucun attribut action= : le formulaire n'envoie rien, nulle part.
  -->
  <div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title" hidden>
    <form class="gate__card" id="gate-form" novalidate autocomplete="off">
      <p class="gate__hi" data-i18n="gateHi">Hey there!</p>
      <h1 class="gate__q" id="gate-title" data-i18n="gateQuestion">I’m Marvin. What’s your name?</h1>

      <label class="gate__label" for="gate-input" data-i18n="gateLabel">My name is</label>
      <input class="gate__input"
             id="gate-input"
             name="visitor"
             type="text"
             inputmode="text"
             maxlength="24"
             autocomplete="off"
             spellcheck="false"
             aria-describedby="gate-hint gate-error"
             placeholder="Your first name">
      <!-- maxlength="24" = premiere limite. app.js re-verifie de toute facon :
           un attribut HTML se contourne, une verification JS aussi, donc on
           fait les deux ET on n'insere jamais le texte en tant que HTML. -->

      <p class="gate__error" id="gate-error" role="alert" hidden data-i18n="gateError"></p>

      <div class="gate__actions">
        <button class="btn btn--primary" type="submit" data-i18n="gateSubmit">Nice to meet you</button>
        <button class="btn btn--ghost" type="button" id="gate-skip" data-i18n="gateSkip">Skip this</button>
      </div>

      <p class="gate__hint" id="gate-hint" data-i18n="gateHint"></p>
    </form>
  </div>

  <!--
    ===================== 3. BARRE DE PROGRESSION =====================
    Une fine barre en haut de l'ecran qui se remplit a mesure qu'on descend.
    Demandee dans le cahier des charges : "indiquer a quelle distance de la
    fin se trouve la position de scroll".
  -->
  <div class="progress" id="progress" aria-hidden="true">
    <div class="progress__fill" id="progress-fill"></div>
  </div>

  <!--
    ===================== 4. EN-TETE =====================
    position: sticky en CSS -> reste visible pendant le defilement.

    SOUS 860px IL EST VIDE : le nom est masque et la pilule est posee au bas
    de la fenetre (section 12 du CSS). Il reste dans le document parce que la
    pilule est son enfant — le supprimer supprimerait la navigation — mais il
    ne mesure plus rien et ne peint plus rien. Ne pas y remettre de contenu
    sans regarder ce media : il reapparaitrait en bande collante.
  -->
  <!--
    L'EN-TETE N'EST PLUS QU'UN SUPPORT. Il n'a plus qu'un enfant, la pilule,
    qui prend toute sa largeur et porte desormais TOUT : le nom a gauche, les
    entrees au centre, Resume et Contact a droite. Lui-meme n'a plus ni fond
    ni filet — c'est la pilule qu'on voit, une seule surface au lieu de deux
    (un aplat pleine largeur avec une pilule posee au milieu).
    Le nom etait auparavant un frere de la pilule, dans une grille a trois
    colonnes ; il est entre dedans sans bouger d'un pixel, le retrait interne
    de la pilule etant retire du retrait de l'en-tete (voir --nav-pad-x,
    section 4 du CSS).
  -->
  <header class="site-head" id="site-head">
    <!--
      SOUS 860px, CETTE MEME PILULE EST LA BARRE D'ONGLETS DU BAS. Il n'y a
      qu'un menu, qui change de place et non de nature : memes liens, meme
      ordre, meme soulignement de l'entree en cours. Le bouton hamburger qui
      se trouvait juste au-dessus, et le tiroir plein ecran qu'il ouvrait,
      ont disparu avec ce deplacement — un menu visible en permanence n'a
      rien a ouvrir. Voir la section 12 du CSS.

      CE QUI N'EST PAS DANS LES DEUX ETATS, et pourquoi :

        - Le nom et le groupe de droite (Resume, Contact) ne descendent pas
          dans la barre. Resume et Contact sortent du site — un PDF, un
          mailto — ce qui n'est pas de la navigation, et le pied de page les
          porte deja tous les deux. Le nom, lui, ferait doublon avec Home.
        - Home ne monte pas dans la pilule. Sur le bureau c'est le nom, a
          gauche, qui ramene a l'accueil : une entree de plus serait la meme
          destination une seconde fois. Mais sous 860px le nom est masque
          avec l'en-tete, et sans elle plus rien ne ramene explicitement en
          haut de l'accueil — d'ou #nav-home, visible seulement la (CSS
          section 4 pour le masquage, section 12 pour l'inverse).
    -->
    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <!-- Le nom est le lien d'accueil depuis que "Home" a quitte la pilule.
           Il vise l'ancre #hello (le heros de la page d'accueil, id
           sec-hello, pose par pageHome) et non "#/" tout court : depuis
           l'accueil, "#/" ne changerait rien a l'URL et le clic serait sans
           effet visible. Avec l'ancre, il ramene toujours a la salutation,
           qu'on vienne d'une autre page ou du bas de celle-ci.
           Il est masque sous 860px avec le reste de l'en-tete : c'est
           #nav-home, dans la barre du bas, qui reprend son role la-bas. -->
      <a class="brand" href="#/#hello" aria-label="Marvin Sorhaindo, home">Marvin S.</a>

      <!-- LES DEUX GROUPES SONT LA POUR LA GRILLE DU BUREAU, pas pour le
           sens : ils donnent au centre et a la droite chacun leur colonne,
           ce qu'une liste plate de liens ne permettait pas. Sous 860px ils
           repassent en display:contents (le centre) ou disparaissent (la
           droite), et la barre retrouve ses entrees en enfants directs. -->
      <!-- data-spy : la section d'accueil que ce lien surveille. C'est la
           meme convention que la nav laterale d'une etude de cas, et c'est
           setupHomeNavSpy (app.js) qui s'en sert pour allumer le lien quand
           on entre dans la section. About n'en a pas : c'est une page. -->
      <!-- Home porte les deux attributs, et c'est data-nav qui compte le
           moins : markActiveNav ne l'allumera jamais, parce que la route
           "home" ne designe plus aucune entree (voir la table de
           correspondance dans app.js). Il est la pour l'autre moitie du
           travail de cette fonction — RETIRER aria-current des entrees qui
           ne sont pas la page affichee. Sans lui, Home restait souligne
           apres etre passe sur About : le spy ne nettoie que ses propres
           "location", et markActiveNav ne balaye que les liens porteurs de
           data-nav. C'est data-spy qui l'allume, et lui seul, tant qu'on lit
           le heros — exactement comme Work et Side quests. -->
      <div class="site-nav__links">
        <a id="nav-home" href="#/#hello" data-nav="home" data-spy="sec-hello" data-i18n="navHome">Home</a>
        <a href="#/#work" data-nav="work" data-spy="sec-work" data-i18n="navWork">Work</a>
        <a href="#/#side" data-nav="side" data-spy="sec-side" data-i18n="navSide">Side quests</a>
        <a href="#/about" data-nav="about" data-i18n="navAbout">About</a>
      </div>

      <!-- Les deux href sont poses par applyTexts (app.js) : l'adresse et le
           fichier vivent dans SITE (content.js), comme pour les liens du pied
           de page, et non recopies ici ou ils divergeraient. -->
      <div class="site-nav__end">
        <a id="nav-resume" href="#" target="_blank" rel="noopener noreferrer" data-i18n="navResume">Resume</a>
        <a id="nav-contact" href="mailto:" data-i18n="navContact">Contact</a>
      </div>
    </nav>
  </header>

  <!--
    ===================== 5. LIEN RETOUR PERSISTANT =====================
    Demande dans le cahier des charges : "un lien retour collant, accessible
    a tout moment". Il n'apparait que sur les pages de detail (app.js ajoute
    ou retire la classe is-visible).
  -->
  <a class="back-link" id="back-link" href="#/" hidden>
    <span aria-hidden="true">←</span> <span data-i18n="csBack">Back</span>
  </a>

  <!--
    ===================== 6. LE CONTENU =====================
    Vide au depart. app.js y injecte la page demandee par l'URL.
    tabindex="-1" permet de deplacer le focus ici lors d'un changement de
    page, pour que les lecteurs d'ecran annoncent la nouvelle page.
    aria-live="polite" : les changements sont annonces sans interrompre.
  -->
  <!--
    #page enveloppe le contenu ET le pied de page. C'est LA FICHE : le bloc
    qui monte, prend un fond blanc et des coins arrondis quand une etude de
    cas s'ouvre (voir body.is-overlay dans styles.css). Envelopper les deux
    est indispensable — sans ca, le pied de page resterait en dehors du
    panneau, sur le bleu du site, et la fiche s'arreterait au milieu de rien.
  -->
  <!--
    La croix de fermeture. Elle est SOEUR de #page, pas son enfant : la fiche
    se decoupe a ses coins arrondis (overflow: clip, voir styles.css), et une
    croix a l'interieur risquerait d'etre rognee avec le reste. Dehors, elle
    flotte au-dessus de tout sans dependre du decoupage ni du contexte
    d'empilement de la fiche.
    theme-light est indispensable justement PARCE QU'elle est dehors : les
    couleurs s'heritent, et hors de la fiche cette croix reprenait les
    jetons de marque — soit une croix blanche et un liser blanc sur le
    disque blanc translucide. Invisible. La classe lui redonne l'encre
    foncee du theme clair, le seul fond sur lequel elle apparaisse jamais.
    C'est un <a> et non un <button> : fermer, ici, c'est simplement naviguer
    vers la liste des projets. Le lien fonctionne donc au clic du milieu, au
    copier-lien, et l'historique du navigateur reste juste. app.js ajuste sa
    destination selon le projet ouvert (work / side).
  -->
  <!--
    ===================== LE VOILE =====================
    Le flou n'appartient a rien : c'est une vitre depolie posee EN TRAVERS de
    l'ecran, et tout ce qui se trouve derriere elle est floute — la photo de
    la page d'accueil comme l'en-tete du site, qui est un element bien reel
    et reste a sa place pendant toute la duree de la fiche.

    D'ou l'empilement, de bas en haut : accueil et navigation, puis ce voile
    qui les brouille ensemble, puis la fiche par-dessus. Il est donc place
    ICI, apres l'en-tete et avant la fiche — l'ordre du document suit
    l'ordre des couches (z-index 124, entre les 120 de .site-head et les 125
    de #page).

    Une version anterieure floutait la photo elle-meme (filter sur le clone)
    et laissait la navigation nette par-dessus : il fallait alors
    l'assombrir a part pour qu'elle ne tranche pas, et elle restait lisible
    quand tout le reste ne l'etait plus.

    Vide et aria-hidden : c'est un effet, il n'y a rien a lire ni a
    atteindre dedans. pointer-events:none en CSS pour le reste.
  -->
  <div id="veil" class="veil" aria-hidden="true"></div>

  <a class="overlay-close theme-light" id="overlay-close" href="#/#work" hidden aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round"/>
    </svg>
  </a>

  <div id="page" class="page">

    <main id="main" tabindex="-1"></main>

    <!--
      ===================== 7. PIED DE PAGE =====================
      Rempli par app.js pour rester traduisible sans dupliquer le balisage.
    -->
    <footer class="site-foot" id="site-foot"></footer>

  </div>

  <!--
    type="module" fait trois choses utiles :
      1. autorise import / export entre nos fichiers JS,
      2. differe l'execution jusqu'a ce que le HTML soit pret (pas besoin
         d'attribut defer, ni d'ecouter DOMContentLoaded),
      3. active le mode strict de JavaScript, qui transforme certaines
         erreurs silencieuses en vraies erreurs — plus facile a debugger.
  -->
  <script type="module" src="js/app.js"></script>

  <!--
    SANS JAVASCRIPT : le site est une SPA, il ne peut donc rien afficher.
    Plutot que de laisser une page blanche, on affiche un message et les
    liens de contact essentiels. C'est le minimum acceptable.
  -->
  <noscript>
    <div class="noscript">
      <h1>Marvin Sorhaindo — Product designer</h1>
      <p>This portfolio needs JavaScript to work. You can reach me directly:</p>
      <p>
        <a href="mailto:hello@marvinsrd.com">hello@marvinsrd.com</a> ·
        <a href="https://www.linkedin.com/in/marvinsorhaindo">LinkedIn</a>
      </p>
    </div>
  </noscript>

</body>
</html>
